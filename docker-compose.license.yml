# Upgrade overlay for the existing /opt/YiYi-deploy instance. It preserves the
# current PostgreSQL/Redis bind mounts and adds the customer license boundary.
services:
  license-agent:
    image: ${YIYI_LICENSE_AGENT_IMAGE:?请设置 License Agent 镜像}
    restart: unless-stopped
    network_mode: host
    environment:
      YIYI_LICENSE_SERVER_URL: ${YIYI_LICENSE_SERVER_URL:?请设置授权服务器 HTTPS 地址}
      YIYI_LICENSE_STATE_DIR: /var/lib/yiyi-license
      YIYI_LICENSE_LEASE_FILE: /var/run/yiyi-license/lease.jwt
      YIYI_LICENSE_ACTIVATION_FILE: /var/lib/yiyi-license/activation-code
      YIYI_LICENSE_PUBLIC_JWK_FILE: /etc/yiyi/license-public.jwk
      YIYI_LICENSE_AGENT_LISTEN: 127.0.0.1:18088
      YIYI_LICENSE_CLIENT_VERSION: ${YIYI_RELEASE_VERSION:?请设置发布版本}
      YIYI_LICENSE_RENEW_INTERVAL: ${YIYI_LICENSE_RENEW_INTERVAL:-6h}
    volumes:
      - ./data/license/state:/var/lib/yiyi-license
      - ./data/license/lease:/var/run/yiyi-license
      - ./data/license/license-public.jwk:/etc/yiyi/license-public.jwk:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18088/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  config:
    image: ${YIYI_CONFIG_IMAGE:?请设置 Config 镜像}
    depends_on:
      license-agent: {condition: service_healthy}
    environment: &license-env
      YIYI_LICENSE_LEASE_FILE: /var/run/yiyi-license/lease.jwt
      YIYI_LICENSE_PUBLIC_JWK_FILE: /etc/yiyi/license-public.jwk
      YIYI_LICENSE_NATIVE_REQUIRED: "true"
      YIYI_LICENSE_NATIVE_LIBRARY: /opt/yiyi/lib/libyiyi_license_native.so
      YIYI_LICENSE_AGENT_URL: http://127.0.0.1:18088
      YIYI_DOCKER_ONLY: "true"
    volumes: &license-volumes
      - ./data/license/lease:/var/run/yiyi-license:ro
      - ./data/license/license-public.jwk:/etc/yiyi/license-public.jwk:ro

  user:
    image: ${YIYI_USER_IMAGE:?请设置 User 镜像}
    depends_on:
      license-agent: {condition: service_healthy}
    environment: *license-env
    volumes: *license-volumes

  media:
    image: ${YIYI_MEDIA_IMAGE:?请设置 Media 镜像}
    depends_on:
      license-agent: {condition: service_healthy}
    environment: *license-env
    volumes: *license-volumes

  gateway:
    image: ${YIYI_GATEWAY_IMAGE:?请设置 Gateway 镜像}
    depends_on:
      license-agent: {condition: service_healthy}
    environment: *license-env
    volumes: *license-volumes

  frontend:
    image: ${YIYI_FRONTEND_IMAGE:?请设置 Frontend 镜像}
