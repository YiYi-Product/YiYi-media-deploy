# YiYi Media 单机版部署（STANDALONE）—— 严格三容器 Compose。
#
# 适用模式：单机版部署。分布式部署请改用 compose.distributed.yaml
# （安装脚本为 install-distributed.sh）。
#
# 标准拓扑（单机版开发计划 §3.2、§5.3、§12.1）：
#
#   ┌────────────── yiyi-app 容器 ──────────────┐
#   │ frontend/nginx  :18080  ← 唯一对外入口     │
#   │ gateway        :18086  仅容器内部          │
#   │ config         :18085  仅容器内部          │
#   │ user           :18082  仅容器内部          │
#   │ media          :18083  仅容器内部          │
#   │ storage        :18084  仅容器内部          │
#   │ play-agent     :19090  默认只绑宿主机回环   │
#   │ license-agent  :18088  仅容器内部          │
#   └───────────────────────────────────────────┘
#              │                    │
#        postgres 容器        redis 容器
#
# 硬性约束：
#   * 本文件解析后只能出现 yiyi-app、postgres、redis 三个服务，不使用 profile；
#   * PostgreSQL 与 Redis 走 Compose 私有网络，默认不向宿主机发布任何端口；
#   * 应用容器只发布前端 18080，Play Agent 19090 默认绑定 127.0.0.1；
#   * 应用容器不使用 privileged、不授予 SYS_ADMIN、不挂载 /dev/fuse（计划 §11）；
#   * 镜像标签统一由 YIYI_IMAGE_TAG 锁定。

name: yiyi

# 许可证相关环境变量。聚合镜像内的 license-agent、config、user、media、gateway
# 都读取同一组路径（计划 §12.1 的对外契约）。
x-yiyi-license-env: &yiyi-license-env
  YIYI_LICENSE_LEASE_FILE: /var/run/yiyi-license/lease.jwt
  YIYI_LICENSE_PUBLIC_JWK_FILE: /etc/yiyi/license-public.jwk
  YIYI_LICENSE_NATIVE_REQUIRED: "true"
  YIYI_LICENSE_NATIVE_LIBRARY: /opt/yiyi/lib/libyiyi_license_native.so
  YIYI_LICENSE_STATE_DIR: /var/lib/yiyi-license
  YIYI_LICENSE_ACTIVATION_FILE: /var/lib/yiyi-license/activation-code

services:
  yiyi-app:
    image: ghcr.io/yiyi-product/yiyi-media-standalone:${YIYI_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 允许容器访问**宿主机**上的服务。内网/离线部署时客户可能把授权中心
    # 部署在同一台主机上，此时 YIYI_LICENSE_SERVER_URL 可写
    # http://host.docker.internal:18092（见 README「本机自建授权中心」）。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 聚合容器承载全部服务，因此更不能提权：只做「禁止通过 setuid 提权」这一项收敛，
    # 不添加任何 capability、不使用 privileged，也不挂载 /dev/fuse（计划 §3.4、§11）。
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *yiyi-license-env

      # ── 部署形态（计划 §3.1、§12.2）──────────────────────────────────
      # 由安装脚本固定为 STANDALONE。它只用于收窄能力：产品版本边界始终以
      # 签名租约中的 edition claim 为准，改这里不会扩大授权范围。
      YIYI_DEPLOYMENT_MODE: STANDALONE
      # 内置节点 ID。全新安装用默认值 node-local-*；从旧部署迁入单机版时，
      # 安装脚本会写入**原有节点 ID**，让内置节点沿用原记录，
      # 从而保住宿主媒体源的 nodeId 引用、用户线路授权与历史任务关联（计划 §7.2、§13.2）。
      YIYI_EMBEDDED_STORAGE_NODE_ID: ${YIYI_EMBEDDED_STORAGE_NODE_ID:-node-local-storage}
      YIYI_EMBEDDED_PLAY_AGENT_NODE_ID: ${YIYI_EMBEDDED_PLAY_AGENT_NODE_ID:-node-local-play-agent}

      # ── 数据库（计划 §5.3、§6）───────────────────────────────────────
      # 容器内通过服务名 postgres 互访（不是 127.0.0.1）；四个业务库在同一个
      # PostgreSQL 实例上。
      #
      # 为什么同时给 YIYI_DB_* 和 SPRING_DATASOURCE_* 两组：
      # 聚合镜像的进程监管器（deploy/standalone-app/supervisor.py）按服务逐个
      # 拼接连接串，用的是 ${YIYI_DB_USER} / ${YIYI_DB_PASSWORD} 占位符，
      # 从容器环境展开；缺一个就会在日志里留下"引用未定义变量"的告警，
      # 并让该服务连到错库或用空口令启动。两组都必须提供。
      YIYI_DB_HOST: postgres
      YIYI_DB_PORT: "5432"
      YIYI_DB_USER: ${YIYI_DB_USER:-yiyi}
      YIYI_DB_PASSWORD: ${YIYI_DB_PASSWORD:?请设置 YIYI_DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/yiyi_config
      SPRING_DATASOURCE_USERNAME: ${YIYI_DB_USER:-yiyi}
      SPRING_DATASOURCE_PASSWORD: ${YIYI_DB_PASSWORD:?请设置 YIYI_DB_PASSWORD}

      # ── Redis ────────────────────────────────────────────────────────
      # 同样同时给两组：REDIS_* 是各服务最终读取的名字，YIYI_REDIS_PASSWORD
      # 是监管器占位符展开时需要从容器环境取到的名字。留空表示不启用密码。
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${YIYI_REDIS_PASSWORD:-}
      YIYI_REDIS_PASSWORD: ${YIYI_REDIS_PASSWORD:-}

      # ── 服务间令牌 ───────────────────────────────────────────────────
      YIYI_SERVICE_TOKEN: ${YIYI_SERVICE_TOKEN:?请设置高熵服务令牌}

      # ── 许可证 ───────────────────────────────────────────────────────
      YIYI_LICENSE_SERVER_URL: ${YIYI_LICENSE_SERVER_URL:?请设置授权服务器 HTTPS 地址}
      # 供镜像内各服务上报客户端版本（license-agent 的 YIYI_LICENSE_CLIENT_VERSION）。
      YIYI_IMAGE_TAG: ${YIYI_IMAGE_TAG:-latest}

      # ── 日志根目录（计划 §6）─────────────────────────────────────────
      LOG_DIR: /data/logs

      # ── 第三方登录（可选，保持现有变量名）────────────────────────────
      YIYI_TELEGRAM_BOT_TOKEN: ${YIYI_TELEGRAM_BOT_TOKEN:-}
      YIYI_TELEGRAM_BOT_USERNAME: ${YIYI_TELEGRAM_BOT_USERNAME:-}
      YIYI_TELEGRAM_MINIAPP_URL: ${YIYI_TELEGRAM_MINIAPP_URL:-}
      YIYI_TELEGRAM_WEBHOOK_SECRET: ${YIYI_TELEGRAM_WEBHOOK_SECRET:-}
      YIYI_GOOGLE_CLIENT_ID: ${YIYI_GOOGLE_CLIENT_ID:-}
    volumes:
      # 许可证身份与租约（计划 §6）
      - type: bind
        source: ${YIYI_DATA_DIR:-./data}/license/identity
        target: /var/lib/yiyi-license
      - type: bind
        source: ${YIYI_DATA_DIR:-./data}/license/lease
        target: /var/run/yiyi-license
      # 授权公钥（信任根）。由 install.sh 从授权服务器同步并做一致性校验后写入。
      - ./config/license-public.runtime.jwk:/etc/yiyi/license-public.jwk:ro
      # 上传文件
      - type: bind
        source: ${YIYI_DATA_DIR:-./data}/config/uploads
        target: /data/config/uploads
      # 内置 Storage 的持久化数据：mount-data / spool / read-cache
      - type: bind
        source: ${YIYI_DATA_DIR:-./data}/storage
        target: /data/storage
      # 内置 Play Agent 缓存：vfs-cache / image-cache
      - type: bind
        source: ${YIYI_DATA_DIR:-./data}/play-agent
        target: /data/play-agent
      # 七个服务的日志目录
      - type: bind
        source: ${YIYI_DATA_DIR:-./data}/logs
        target: /data/logs
    ports:
      # 唯一对外的业务端口。
      - "${YIYI_APP_BIND_HOST:-0.0.0.0}:${YIYI_APP_PORT:-18080}:18080"
      # Play Agent 默认只绑宿主机回环地址，供宿主机 nginx / Caddy 反代。
      # 需要让另一台机器上的反代访问时必须显式改绑定地址，并限制来源 IP（计划 §5.3）。
      - "${YIYI_PLAY_AGENT_BIND_HOST:-127.0.0.1}:${YIYI_PLAY_AGENT_PORT:-19090}:19090"
    # 沿用聚合镜像自带的 HEALTHCHECK（/opt/yiyi/healthcheck.py）：它不只看进程存活，
    # 而是逐一确认全部内部服务与两个内置节点的状态（计划 §5.2、§16）。

  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${YIYI_DB_USER:-yiyi}
      POSTGRES_PASSWORD: ${YIYI_DB_PASSWORD:?请设置 YIYI_DB_PASSWORD}
    volumes:
      - type: bind
        source: ${YIYI_DATA_DIR:-./data}/postgres
        target: /var/lib/postgresql/data
      # 仅在数据目录为空、PostgreSQL 首次初始化时执行，用于创建四个业务库。
      # 升级旧数据目录时不会重新执行，缺失的库由 install.sh 幂等补齐。
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-init-yiyi.sql:ro
    # 不向宿主机发布端口：只允许 yiyi-app 通过 Compose 私有网络访问。
    # 需要 psql 排障时用 `docker compose exec postgres psql ...`。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - sh
      - -ec
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    environment:
      REDIS_PASSWORD: ${YIYI_REDIS_PASSWORD:-}
    volumes:
      - type: bind
        source: ${YIYI_DATA_DIR:-./data}/redis
        target: /data
    # 同样不发布端口：PostgreSQL、Redis 都只在 yiyi-app 所在网络内可达。
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null; else redis-cli ping; fi | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
