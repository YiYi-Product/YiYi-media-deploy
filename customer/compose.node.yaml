services:
  storage:
    image: ${YIYI_STORAGE_IMAGE:?请在 .env 设置带摘要的 Storage 镜像}
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres: {condition: service_healthy}
      config: {condition: service_healthy}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:${YIYI_DB_PORT:-5432}/yiyi_storage
      SPRING_DATASOURCE_USERNAME: ${YIYI_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${YIYI_DB_PASSWORD}
      STORAGE_REGISTRY_CONFIG_SERVER: http://127.0.0.1:18085
      STORAGE_REGISTRY_HOST: ${YIYI_SERVER_HOST:?请设置服务器地址}
      STORAGE_REGISTRY_IP: ${YIYI_SERVER_HOST}
      YIYI_NODE_ID: ${YIYI_STORAGE_NODE_ID:?请设置已在控制面创建的 Storage 节点 ID}
      YIYI_SERVICE_TOKEN: ${YIYI_SERVICE_TOKEN}
      LOG_DIR: /data/logs
    volumes:
      - storage_data:/data/storage
      - storage_logs:/data/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18084/api/storage/ping >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  play-agent:
    image: ${YIYI_PLAY_AGENT_IMAGE:?请在 .env 设置带摘要的 Play Agent 镜像}
    restart: unless-stopped
    network_mode: host
    depends_on:
      config: {condition: service_healthy}
    environment:
      YIYI_NODE_ID: ${YIYI_PLAY_AGENT_NODE_ID:?请设置已在控制面创建的 Play Agent 节点 ID}
      YIYI_SERVICE_TOKEN: ${YIYI_SERVICE_TOKEN}
      PLAY_AGENT_LISTEN: :19090
      PLAY_AGENT_PUBLIC_BASE_URL: http://${YIYI_SERVER_HOST}:19090
      PLAY_AGENT_CONFIG_BASE_URL: http://127.0.0.1:18085
      PLAY_AGENT_MEDIA_BASE_URL: http://127.0.0.1:18083
      PLAY_AGENT_USER_BASE_URL: http://127.0.0.1:18082
      PLAY_AGENT_REGISTRY_HOST: ${YIYI_SERVER_HOST}
      PLAY_AGENT_REGISTRY_IP: ${YIYI_SERVER_HOST}
      PLAY_AGENT_REGISTRY_PORT: "19090"
      PLAY_AGENT_VFS_CACHE_DIR: /data/vfs-cache
      PLAY_AGENT_IMAGE_CACHE_DIR: /data/image-cache
    volumes:
      - play_agent_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:19090/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  storage_data:
  storage_logs:
  play_agent_data:
